<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Autoservice Tester</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; margin: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; width: 80%; }
        #qr-container img { margin-top: 15px; max-width: 300px; border-radius: 8px; image-rendering: pixelated; }
        .status { margin-bottom: 15px; font-weight: bold; }
        .log { margin-top: 20px; font-family: monospace; font-size: 12px; background: #f4f4f4; padding: 10px; text-align: left; border-radius: 4px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>WhatsApp Tester</h2>
        <div class="status" id="status-text">Status: Checking...</div>
        
        <div id="qr-container"></div>

        <hr>
        <h3>Send Message</h3>
        <input type="text" id="phone" placeholder="Phone (e.g. 5491122334455)">
        <input type="text" id="message" placeholder="Message text">
        <br>
        <button onclick="sendMessage()">Send</button>

        <hr>
        <button onclick="disconnect()" style="background: #dc3545;">Disconnect</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        const TOKEN = 'super_secret_token_123';
        const BASE_URL = 'http://localhost:5001/api';
        
        function logMsg(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            document.getElementById('log').prepend(div);
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`${BASE_URL}/status`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();
                document.getElementById('status-text').innerText = `Status: ${data.state} (Connected: ${data.connected})`;
                
                if (data.connected) {
                    document.getElementById('qr-container').innerHTML = `<p style="color: green;">Connected as ${data.phone}</p>`;
                } else if (data.qrAvailable) {
                    fetchQR();
                } else {
                    document.getElementById('qr-container').innerHTML = '';
                }
            } catch (err) {
                document.getElementById('status-text').innerText = `Status: Error connecting to API`;
            }
        }

        async function fetchQR() {
            try {
                const res = await fetch(`${BASE_URL}/qr`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();
                if (data.qr) {
                    document.getElementById('qr-container').innerHTML = `<img src="${data.qr}" alt="WhatsApp QR">`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function sendMessage() {
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            if(!phone || !message) return alert('Enter phone and message');
            
            try {
                const res = await fetch(`${BASE_URL}/send`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone, message })
                });
                const data = await res.json();
                logMsg(JSON.stringify(data));
            } catch (err) {
                logMsg('Error sending message: ' + err.message);
            }
        }

        async function disconnect() {
            try {
                const res = await fetch(`${BASE_URL}/disconnect`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();
                logMsg('Disconnected: ' + JSON.stringify(data));
            } catch (err) {
                logMsg('Error disconnecting: ' + err.message);
            }
        }

        // Poll status every 3 seconds
        setInterval(fetchStatus, 3000);
        fetchStatus();
    </script>
</body>
</html>
